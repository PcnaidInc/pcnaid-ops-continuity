name: Continuity checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: continuity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify available Node version
        run: node -e 'if(Number(process.versions.node.split(".")[0])<22)process.exit(1)'
      - name: Syntax checks
        run: npm run check
      - name: Unit and integration tests
        run: npm test
      - name: Regenerate fictional demos
        run: npm run demo
